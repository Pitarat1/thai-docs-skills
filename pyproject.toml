[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thaidocs"
version = "0.1.0"
description = "เครื่องมือจัดหน้าและตัดคำไทยสำหรับเอกสาร Word"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "lxml",
]

[project.scripts]
thaidocx = "thaidocs.cli:main"

[project.optional-dependencies]
khammoon = ["numpy"]
dev = ["pytest", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thaidocs = ["data/*.txt", "_khammoon/model/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
