name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: python tools/build.py --check
      - run: python tools/build.py --zip
      # softprops/action-gh-release v3.0.4 (commit SHA ตรวจจาก api.github.com/repos/softprops/action-gh-release)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            dist/thai-docx.zip
            dist/thai-docx-nokhammoon.zip
            dist/thai-official-letters.zip
            dist/thai-official-letters-nokhammoon.zip
